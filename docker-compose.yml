services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env.docker}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loja_gotica_test}
      MYSQL_USER: ${MYSQL_USER:-darkmoon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env.docker}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./loja_gotica_test.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-loja_gotica_test}
      DB_USER: ${DB_USER:-darkmoon}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env.docker}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env.docker}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador DarkMoon}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@darkmoon.com}
      ADMIN_CPF: ${ADMIN_CPF:-111.444.777-35}
      ADMIN_SENHA: ${ADMIN_SENHA:?Defina ADMIN_SENHA no .env.docker}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  site:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - frontend

volumes:
  mysql_data:

networks:
  frontend:
  backend:
    internal: true
